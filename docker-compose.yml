services:
  postgres:
    image: postgres:16
    container_name: labrutal-postgres
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - labrutal-net

  redis:
    image: redis:7-alpine
    container_name: labrutal-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - labrutal-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: labrutal-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - labrutal-net

volumes:
  pgdata:
  redisdata:

networks:
  labrutal-net:
    driver: bridge
